      <section class="form-card"><h2>Add New User</h2><form onsubmit="saveSystemUser(event)"><div class="form-grid"><div class="form-group"><label>Full Name</label><input id="fullName" type="text" minlength="3" required></div><div class="form-group"><label>Username</label><input id="username" type="text" minlength="3" pattern="[A-Za-z0-9_]+" required></div><div class="form-group"><label>Password</label><input id="password" type="password" minlength="6" required></div><div class="form-group"><label>Role</label><select id="role" required><option value="staff">Staff</option><option value="admin">Admin</option></select></div></div><div class="form-actions"><button class="btn" type="submit">Save user</button><button class="btn" type="reset" style="background:#487674">Clear</button></div></form></section>
