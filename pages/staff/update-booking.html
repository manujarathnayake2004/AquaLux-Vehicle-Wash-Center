      <section class="form-card"><h2>Update Booking</h2><form onsubmit="saveBooking(event)"><div class="form-grid"><div class="form-group"><label>Booking ID</label><input id="bookingId" type="text" required></div><div class="form-group"><label>Package</label><select id="package" required><option value="">Loading active packages...</option></select></div><div class="form-group"><label>Date</label><input id="date" type="date" required></div><div class="form-group"><label>Time</label><input id="time" type="time" min="08:00" max="17:30" step="1800" required></div><div class="form-group"><label>Status</label><select id="status" required><option>Pending</option><option>Completed</option><option>Cancelled</option></select></div></div><div class="form-actions"><button class="btn" type="submit">Save</button><button class="btn" type="reset" style="background:#487674">Clear</button></div></form></section>
